note: >-
  All signals come from the single consolidated Policies page (Terms of Use, Acceptable Use Policy,
  Privacy Notice and Services Privacy Notice are sections of one document at
  https://www.campaignmonitor.com/policies/). A plain curl returned 403; fetch-url.py (plain strategy,
  browser UA) returned 200 with the full text. Signals not listed here (incident_notification,
  global_privacy_control, accessibility_conformance, transparency_report, sbom, etc.) were not
  spoken to on this page.
signals:
  data_subject_request:
    url: https://www.campaignmonitor.com/policies/#privacy-policy
    section: Access, Correction, and Deletion
    rights_named: [know, access, correct, delete, opt out of sale or sharing, limit use of sensitive personal information, non-discrimination]
    evidence:
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        California consumers whose Personal Data is Processed by Campaign Monitor acting as a business under
        CPRA may, no more than twice in a 12 month period and at no cost to them, request a report from us
        which details the Personal Data collected about them and the recipients, if any, of that information,
        as well as the business or commercial purpose for collecting personal information and the categories
        of sources from which the personal information is collected.
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        If you are a Customer Data Subject and wish to have your Personal Data deleted, please contact the
        Customer directly so we may assist them in carrying out your request.
    note: >-
      Campaign Monitor publishes a CPRA access/correction/deletion route for people it processes data about
      as a business (requests via a support request form, per the same paragraph), while subscribers whose
      data a customer uploads (Customer Data Subjects) are routed to the customer as controller.
  subprocessors:
    url: https://www.campaignmonitor.com/policies/#privacy-policy
    section: Do you transfer my personal data outside the EEA, Switzerland, or UK?
    evidence:
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Our sub-processors may Process Personal Data in additional jurisdictions.
    note: >-
      The page acknowledges sub-processors and that they may process data outside Campaign Monitor's own
