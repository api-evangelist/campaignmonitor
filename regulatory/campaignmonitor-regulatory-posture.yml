  exit_assistance:
    url: https://www.campaignmonitor.com/policies/#terms-of-use
    section: Effect of Termination
    evidence:
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        (d) Company may delete Customer Content and/or any archived data within 30 days after the date of
        expiration or any termination of this Agreement. Any statutory retention requirements with respect to
        Customer Content remains Customer’s responsibility.
    note: >-
      The terms set a 30-day post-termination deletion window and leave retention to the customer. They make
      no data-export or transition-assistance commitment, which is recorded here as an absence of exit
      assistance rather than a right.
