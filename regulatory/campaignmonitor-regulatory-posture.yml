    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        Customer is prohibited from inputting or uploading any personal data (any information that identifies
        an individual (directly or indirectly)) into the Generative AI Services.
    note: >-
      The Acceptable Use Policy discloses that the Services include generative AI functionality, treats Input
