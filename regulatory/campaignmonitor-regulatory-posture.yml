  data_residency:
    url: https://www.campaignmonitor.com/policies/#privacy-policy
    section: Do you transfer my personal data outside the EEA, Switzerland, or UK?
    regions_named: [United States, United Kingdom, European Union, Australia]
    transfer_mechanism: EU Standard Contractual Clauses
    evidence:
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        In most cases, yes. Processing may occur in any jurisdiction in which Campaign Monitor is established,
        including the United States, United Kingdom, European Union, and Australia.
    - source: https://www.campaignmonitor.com/policies/
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        In particular, we implement the European Commission’s Standard Contractual Clauses (“EU SCCs”) for
        transfers of Personal Data between our group companies, which require all group companies to protect
        Personal Data they process from the EEA or UK in accordance with European Union and UK data protection law.
    note: >-
      No customer-selectable data residency is offered on this page; processing location is described as
