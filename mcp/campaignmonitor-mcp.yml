source: >-
  Candidate tool surface derived from the operations Campaign Monitor documents
  at https://www.campaignmonitor.com/api/v3-3/. Every tool below names the real
  method and path it would wrap; nothing was invented.
notes: >-
  Campaign Monitor publishes NO MCP server — hosted or local. Searched the
  developer documentation, the github.com/campaignmonitor organization (23 public
  repos, all API wrappers and legacy plugins), npm, and the public MCP registries.
  Two subdomains were probed and are NOT MCP endpoints:
  https://mcp.campaignmonitor.com/ returns 301 to the marketing homepage and
  https://mcp.createsend.com/ returns 302 to the app login — both are wildcard
  DNS catch-alls. This artifact is a design sketch only; no endpoint is implied
  to exist.
