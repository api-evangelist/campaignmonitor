agent_safety:
  idempotency: >-
    NONE. Campaign Monitor documents no idempotency key. Any tool wrapping
    campaignmonitor_send_campaign or campaignmonitor_send_smart_email must treat
    a timeout as an indeterminate outcome and reconcile by reading state back
    (campaign summary, transactional message listing) rather than retrying.
  destructive_operations:
    - POST /campaigns/{campaignid}/send — irreversible mail send to a full list
    - POST /transactional/smartEmail/{smartEmailID}/send — irreversible mail send
    - DELETE /lists/{listid} — deletes a list
    - DELETE /clients/{clientid} — deletes a client and everything under it
    - POST /subscribers/{listid}/import — bulk mutation of up to 1000 subscribers
  rate_limits: rate-limits/campaignmonitor-rate-limits.yml
  errors: errors/campaignmonitor-error-codes.yml
