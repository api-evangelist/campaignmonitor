price_note: Re-read 2026-10-21. A browser-UA GET of https://www.campaignmonitor.com/pricing/ returns HTTP 200 (611,883
  bytes), but the served HTML carries only the placeholder "$ /month" for Lite, Essentials and Premier; the amounts
