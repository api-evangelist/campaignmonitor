source: https://www.campaignmonitor.com/api/v3-3/getting-started/ plus the per-area error reference blocks
  published on https://www.campaignmonitor.com/api/v3-3/{account,campaigns,clients,journeys,lists,segments,subscribers,templates,transactional}/
  — every code below was transcribed from Campaign Monitor's own documentation pages on 2026-08-13. Nothing
  was inferred.
description: Campaign Monitor's error registry. The API does NOT use RFC 9457 problem+json — it returns
  a flat envelope with a numeric application Code and a Message, in JSON or XML depending on the requested
  representation. The numeric code is the stable identifier; the HTTP status is coarse (almost every application
  error is a 400, and an unauthorised or unowned resource is a 401 rather than a 403/404).
format: proprietary
envelope:
  json: '{"Code": <int>, "Message": "<string>"}'
  xml: <Result><Code>…</Code><Message>…</Message></Result>
  content_types:
  - application/json; charset=utf-8
  - application/xml; charset=utf-8
  note: Some validation responses add a ResultData object carrying per-item detail (for example subscriber
    import failures, code 210, and segment rule parsing, codes 277/2703).
http_status_semantics:
- status: 200
  meaning: GET succeeded; PUT updated; DELETE deleted; POST performed a non-creating action (for example
    sending a campaign).
- status: 201
  meaning: POST created a resource.
- status: 202
  meaning: Transactional send accepted; response is an array with a MessageID per recipient.
- status: 400
  meaning: Input error. Body carries the numeric Code and Message.
- status: 401
  meaning: Authentication failure OR a resource ID that does not belong to the caller OR missing OAuth
    permission (code 60).
- status: 403
  meaning: Agency-only resource requested by a non-agency customer.
- status: 404
  meaning: Resource does not exist.
- status: 410
  meaning: Transactional message can no longer be resent (attachments or expired content).
- status: 429
  meaning: Transactional rate limit exceeded.
- status: 500
  meaning: Unhandled server error.
