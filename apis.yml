x-coverage:
  state: covered
  reason: no-machine-readable-spec
  detail: >-
    The API is fully public and richly documented in HTML — 117 operations, 240
    numeric error codes, 12 OAuth permissions and a webhook catalog were all read
    straight off campaignmonitor.com/api/v3-3/ — but Campaign Monitor publishes
    no OpenAPI: /openapi.json, /swagger.json, /api-docs and /docs all 404 on
    api.createsend.com, and there is no MCP server, no AsyncAPI and no agent card.
  evidence:
    - url: https://api.createsend.com/openapi.json
      status: 404
    - url: https://api.createsend.com/swagger.json
      status: 404
