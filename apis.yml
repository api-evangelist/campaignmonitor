aid: campaignmonitor
name: Campaign Monitor
description: >-
  Campaign Monitor, a Marigold brand, is an email marketing platform for
  marketers and agencies. Its REST API — served under the original createsend
  name at api.createsend.com/api/v3.3 — manages clients, subscriber lists,
  subscribers and custom fields, segments, campaigns, HTML templates, automated
  journeys, authenticated sending domains and transactional email, and returns
  per-recipient reporting for opens, clicks, bounces, unsubscribes and spam
  complaints. Authentication is OAuth 2.0 with twelve coarse permissions, or an
  API key over HTTP Basic. Per-list webhooks push Subscribe, Update and
  Deactivate events. Campaign Monitor publishes no OpenAPI, no AsyncAPI and no
  MCP server; the contract is HTML reference documentation plus seven official
  client libraries.
